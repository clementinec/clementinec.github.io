<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.3.7/dist/photoswipe.css">

<script>
document.addEventListener('DOMContentLoaded', function() {
  const lightbox = new PhotoSwipeLightbox({

    children: 'a',
    pswpModule: PhotoSwipe

  lightbox.init();
});
